<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
      }

      h1 {
        color: #ff6200;
        text-transform: uppercase;
        margin: 0 0 20px 0;
        font-size: 36px;
        letter-spacing: 5px;
      }

      section {
        background-color: #fff;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        width: 350px;
        text-align: center;
        border: 1px solid #fff;
      }

      section:hover {
        border: 1px solid #ff6200;
        transition: border-color 0.3s;
      }

      label {
        display: block;
        margin-bottom: 15px;
        font-weight: bold;
        font-size: 24px;
        color: #333;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 2px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 24px;
        transition: border-color 0.3s;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        border-color: #ff6200;
        outline: none;
      }

      button[type="submit"] {
        background: none;
        border: 1px solid #ff6200;
        color: #ff6200;
        padding: 12px 30px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 24px;
      }

      button[type="submit"]:hover {
        background-color: #ff6200;
        color: #fff;
        transition: background-color 0.3s ease-in-out;
      }
      .alert {
        padding: 15px;
        margin-bottom: 20px;
        border: 1px solid transparent;
        border-radius: 4px;
        font-size: 24px;
      }

      .alert-danger {
        margin-top: 20px;
        background-color: #f8d7da;
        border-color: #dc3545;
        color: #dc3545;
      }
    </style>
  </head>
  <body>
    <h1>TechDocAdvantage Pro</h1>

    <section>
      <form method="POST" action="/login">
        <label for="username">Usuario</label>
        <input type="text" name="username" id="username" required />
        <label for="password">Contraseña</label>
        <input type="password" name="password" id="password" required />
        <button type="submit">Ingresar</button>
      </form>
    </section>
    {% with errors = get_flashed_messages(category_filter=["error"]) %} {% if
    errors %}
    <div class="alert alert-danger">
      {% for msg in errors %}
      <strong>¡Error!</strong> {{ msg }} {% endfor -%}
    </div>

    {% endif %} {% endwith %}
  </body>
</html>
