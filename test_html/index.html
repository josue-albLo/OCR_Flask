<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación de Borde de Botón</title>
    <style>
        .button {
            position: relative;
            display: inline-block;
            padding: 10px 20px;
            color: white;
            background-color: black;
            border: 2px solid transparent;
            cursor: pointer;
            overflow: hidden;
        }

        .button::before,
        .button::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            background-color: white;
            transition: width 0.5s ease-in-out, height 0.5s ease-in-out, top 0.5s ease-in-out, bottom 0.5s ease-in-out, left 0.5s ease-in-out, right 0.5s ease-in-out;
        }

        .button::before {
            bottom: 0;
            left: 50%;
        }

        .button::after {
            top: 0;
            right: 50%;
        }

        .button:hover::before {
            width: 50%;
            left: 0;
            transition-delay: 0.5s;
        }

        .button:hover::after {
            width: 50%;
            right: 0;
            transition-delay: 0.5s;
        }

        .button:hover::before {
            height: 100%;
            width: 2px;
            bottom: 0;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <button class="button">Botón</button>
</body>
</html>
